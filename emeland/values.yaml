# Subchart toggles (gated by condition: in Chart.yaml — skips the subchart entirely when false).
modelsrv-k8s-sensor:
  enabled: true
  fullnameOverride: emeland-k8s-sensor
  image:
    # Leave tag empty to use the subchart appVersion (matches Chart.yaml dependency, e.g. 0.6.4).
    tag: "v0.6.4"
    repository: ghcr.io/emeland-io/modelsrv-k8s-sensor
  manager:
    # Static subscriber baked into the sensor process (restored on every pod start).
    subscriberUrls:
      - "http://emeland-filter:80/api/"
    allowInboundPush: true

# Default values for emeland.
replicaCount: 1

# Resource names are prefixed emeland-* (filter, server, tools, gitsensor, k8s-sensor).
fullnameOverride: emeland

image:
  server:
    registry: ghcr.io/emeland-io
    repository: modelsrv-web-ui-server
    tag: "0.5.5"
    pullPolicy: IfNotPresent
  tools:
    registry: ghcr.io/emeland-io
    repository: emelandctl
    tag: "v0.10.5"
    pullPolicy: IfNotPresent
  gitsensor:
    registry: ghcr.io/emeland-io
    repository: modelsrv-git-sensor
    tag: "v0.9.1-rc1"
    pullPolicy: IfNotPresent
  filter:
    registry: ghcr.io/emeland-io
    repository: modelsrv
    tag: "v0.10.5"
    pullPolicy: IfNotPresent

tools:
  enabled: true
  volumes: []
  volumeMounts: []

# modelsrv-web-ui-server embeds modelsrv in-process (no separate backend sidecar).
server:
  enabled: true
  volumes: []
  volumeMounts: []
  env:
    - name: NO_AUTH
      value: "false"
    # Comma-separated resource types visible without OIDC ownership (used when noAuth is true).
    - name: PUBLIC_RESOURCE_TYPES
      value: "System,SystemInstance,Node,NodeType,Context,ContextType,Finding,FindingType,API,APIInstance,Component,ComponentInstance,FilterRule,MergeRule"

# In-cluster Dex sidecar for local OIDC debugging (same pattern as
# modelsrv-web-ui-server/deploy/demo.yaml). Keep disabled in production;
# point OIDC_ISSUER_URL at an external IdP instead.
# Enable with: helm upgrade ... -f examples/dex/values.yaml
dex:
  enabled: false
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.41.1
    pullPolicy: IfNotPresent
  # Must be reachable from the browser (port-forward) and from the server
  # container (localhost via the sidecar).
  issuer: http://localhost:5556/dex
  clientID: emeland-ui
  logLevel: debug
  redirectURIs:
    - http://localhost:8080/callback
    - http://127.0.0.1:8080/callback
  # email: admin@emeland.io / password: password
  staticPasswords:
    - email: admin@emeland.io
      hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
      username: admin
      userID: "00000000-0000-0000-0000-000000000001"

# Phase0 integrity filter (modelsrv) between sensors and web UI server.
# Flow: gitsensor -> filter -> webserver
#       k8s-sensor -> filter -> webserver
# Static --subscribers / SUBSCRIBERS on modelsrv >= v0.10.2 (no register sidecars).
filter:
  enabled: true
  service:
    port: 80
  k8sSensor:
    apiPort: 8080
  # Downstream modelsrv base API URLs (modelsrv server --subscribers / SUBSCRIBERS).
  subscribers:
    - http://{{ include "emeland.fullname" . }}-server:{{ .Values.service.port }}/api/
  volumes: []
  volumeMounts: []

# Git sensor watches external Git repositories and pushes resource events to the filter or server.
# Subscribers are baked into sensor.yaml (defaults to filter when enabled, else the webserver).
gitsensor:
  enabled: false
  subscribers: []
  listenPort: 24100
  # SSH deploy key: prefer existingSecret over inline deployKey values.
  existingSecret: ""
  deployKey:
    privateKey: ""
    publicKey: ""
  repos: []
  volumes: []
  volumeMounts: []
  # Example:
  # repos:
  #   - type: github
  #     repo: git@github.com:org/landscape.git
  #     branch: main
  #     checkoutDir: /work/checkout/landscape
  #     paths:
  #       - manifests/

imagePullSecrets: []
nameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: emeland.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - emeland.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes to mount in all deployments (at pod spec level).
# Each deployment will mount these volumes in its containers.
# Example:
# volumes:
#   - name: custom-config
#     configMap:
#       name: my-config
#   - name: custom-secret
#     secret:
#       secretName: my-secret
volumes: []

# Additional volume mounts for all containers in all deployments.
# Example:
# volumeMounts:
#   - name: custom-config
#     mountPath: /etc/config
#     readOnly: true
#   - name: custom-secret
#     mountPath: /etc/secrets
#     readOnly: true
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
