{{- if .Values.filter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "emeland.fullname" . }}-filter
  labels:
    {{- include "emeland.labels" . | nindent 4 }}
    component: filter
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "emeland.selectorLabels" . | nindent 6 }}
      component: filter
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "emeland.labels" . | nindent 8 }}
        component: filter
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "emeland.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: filter
          image: {{ include "emeland.filterImage" . | quote }}
          imagePullPolicy: {{ .Values.image.filter.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SERVICE_ADDR
              value: ":8080"
            - name: DATA_DIR
              value: "/data"
            {{- if .Values.filter.subscribers }}
            - name: SUBSCRIBERS
              value: {{ include "emeland.filterSubscribersCSV" . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- with $.Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $.Values.filter.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        {{- with $.Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $.Values.filter.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---

{{- end }}
{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "emeland.fullname" . }}-server
  labels:
    {{- include "emeland.labels" . | nindent 4 }}
    component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "emeland.selectorLabels" . | nindent 6 }}
      component: server
  template:
    metadata:
      {{- if or .Values.dex.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.dex.enabled }}
        checksum/dex: {{ include (print $.Template.BasePath "/configmap-dex.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "emeland.labels" . | nindent 8 }}
        component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "emeland.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dex.enabled }}
      initContainers:
        - name: dex
          image: {{ printf "%s:%s" .Values.dex.image.repository .Values.dex.image.tag | quote }}
          imagePullPolicy: {{ .Values.dex.image.pullPolicy }}
          restartPolicy: Always
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: dex
              containerPort: 5556
              protocol: TCP
            - name: telemetry
              containerPort: 5558
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: telemetry
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: dex-config
              mountPath: /etc/dex
              readOnly: true
      {{- end }}
      containers:
        - name: server
          image: {{ include "emeland.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.dex.enabled .Values.server.env }}
          env:
            {{- if .Values.dex.enabled }}
            {{/* Skip NO_AUTH from server.env when Dex is on so an overlay cannot set NO_AUTH=true and silently disable OIDC. */}}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.dex.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.dex.clientID | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.dex.logLevel | quote }}
            {{- end }}
            {{- range .Values.server.env }}
            {{- if not (and $.Values.dex.enabled (or (eq .name "NO_AUTH") (eq .name "OIDC_ISSUER_URL") (eq .name "OIDC_CLIENT_ID") (eq .name "LOG_LEVEL"))) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with or $.Values.volumeMounts $.Values.server.volumeMounts }}
          volumeMounts:
            {{- with $.Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $.Values.server.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $.Values.volumes $.Values.server.volumes .Values.dex.enabled }}
      volumes:
        {{- if .Values.dex.enabled }}
        - name: dex-config
          configMap:
            name: {{ include "emeland.fullname" . }}-dex
        {{- end }}
        {{- with $.Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $.Values.server.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

---

{{- end }}
