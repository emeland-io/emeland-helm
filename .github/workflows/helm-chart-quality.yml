name: Quality Helm charts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Lint charts
        run: |
          helm dependency update emeland
          helm dependency update emeland-crd
          helm lint emeland
          helm lint emeland-crd

      - name: Render chart default and scenario values
        run: make helm-test
